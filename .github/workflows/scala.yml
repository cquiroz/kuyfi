name: build

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # projectMatrix subproject names, one per Scala version
        project: [kuyfi, kuyfi2_13, kuyfi2_12]

    steps:
      - uses: actions/checkout@v6
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      # Pinned to an exact patch: ZoneRulesBuilderSuite compares kuyfi's output
      # against the JVM's bundled tzdb, and the checked-in data is 2024a, which
      # matches 17.0.12. A newer JDK patch ships newer tzdb and fails 4 zones.
      - name: Setup Java (temurin@17.0.12)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17.0.12+7
          cache: sbt
      - name: Test
        run: sbt "scalafmtCheckAll ; scalafmtSbtCheck ; ${{ matrix.project }}/testFull"

  # Aggregate gate. Branch protection requires a check named "build", which a
  # matrix job cannot provide (its checks are "test (kuyfi2_13)" and so on), so
  # the matrix can grow or shrink without touching the repo settings.
  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check matrix result
        run: '[ "${{ needs.test.result }}" = "success" ]'
